<!-- Interactive script for password reveal toggle -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const passwordIcon = document.getElementById('passwordIcon');

      if (toggleBtn && passwordInput && passwordIcon) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
          passwordIcon.setAttribute('data-icon', isPassword ? 'visibility_off' : 'visibility');
        });
      }
    });
  </script>
